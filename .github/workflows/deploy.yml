name: Deploy Standalone MCP Candidate

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: webless-489821
  REGION: asia-east1
  SERVICE: slimweb-standalone-mcp
  ARTIFACT_REPOSITORY: cloud-run-source-deploy

jobs:
  deploy-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
      - name: Deploy verified immutable candidate preserving runtime
        env:
          STANDALONE: "true"
          PROMOTE: "false"
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          export IMAGE_DIGEST="$(docker image inspect "${IMAGE}" --format '{{index .RepoDigests 0}}')"
          export REVISION_SUFFIX="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/deploy-preserving-runtime.mjs
